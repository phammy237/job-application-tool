name: Job Discovery Sync

# Daily ATS ingestion (docs/JOB_DISCOVERY.md) — deterministic data engineering only. This workflow
# has ZERO dependency on ANTHROPIC_API_KEY/GOOGLE_OAUTH_* — no Claude/LLM call anywhere in its
# path. D7.1's official-posting-resolution step is the one exception to "zero Tavily dependency":
# it uses the project's existing Tavily search capability for URL discovery only (never for
# ranking/facts) — see that step's own comment below.

on:
  schedule:
    - cron: '17 9 * * *' # once daily; an off-the-hour minute to avoid the shared GitHub Actions cron spike
  workflow_dispatch: {}

concurrency:
  group: job-discovery-sync
  cancel-in-progress: false # let an in-flight crawl finish rather than cancel it mid-write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run discovery sync
        run: npm run discovery:sync

      # D7 — bounded Jobright detail-page enrichment (README ingestion, the ATS syncs above, and
      # the ranking recompute below all already run regardless of whether this step's fetches
      # succeed). `continue-on-error` because one or more stale/unreachable Jobright detail pages
      # must never block the ranking recompute that makes this run's newly-synced jobs visible —
      # the exact same failure-isolation principle as one broken ATS source inside discovery:sync
      # itself (docs/JOB_DISCOVERY.md "Failure isolation").
      - name: Enrich Jobright-sourced jobs
        run: npm run discovery:enrich-jobright
        continue-on-error: true

      # D7.1 — Official Posting Resolution: prefers Career OS's own ATS-native catalog first
      # (Strategy A, no network call beyond the ones sync already made), falling back to a bounded
      # Tavily search + deterministic, LLM-free validation (Strategy B) only for jobs the catalog
      # can't already explain. Never used for Match/Coverage/candidate facts — URL discovery only.
      # `continue-on-error` for the same failure-isolation reason as enrichment above: one
      # unresolved job or a Tavily hiccup must never block the ranking recompute below.
      - name: Resolve official employer postings for Jobright jobs
        run: npm run discovery:resolve-postings
        continue-on-error: true

      # Runs only if sync succeeds (default GitHub Actions step behavior — a non-zero exit above
      # stops the job before this step). `discovery:rank` re-extracts stale job_catalog_features
      # first (idempotent, cheap) and then re-scores every user who has a Discovery Scoring
      # Profile — see docs/JOB_DISCOVERY.md "Persistence, versioning, and recomputation" and
      # scripts/discovery/rank.ts. This is what makes newly-synced jobs actually show up in
      # /discover without a manual CLI run or an unrelated settings edit (D6.5 P1 fix — the daily
      # sync alone never populated user_job_match_scores, so list_own_discovery_feed's inner join
      # against it left new jobs invisible). No --user-id: ranks every user with a scoring
      # profile, never a hardcoded id; exits cleanly (0 users ranked) if none exist yet. Zero
      # Claude/Tavily/embedding calls, same as discovery:sync above.
      - name: Recompute discovery rankings
        run: npm run discovery:rank
